name: Daily Log
on:
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "aungzayyanaing"
          git config user.email "aungzayyanaing2@gmail.com"
          TODAY=$(TZ='Asia/Rangoon' date '+%Y-%m-%d')
          if grep -q "^- $TODAY Daily log entry" daily-log.md; then
            echo "Entries for $TODAY already exist, skipping."
            exit 0
          fi
          for i in $(seq 1 10); do
            echo "- $TODAY Daily log entry $i" >> daily-log.md
            git add daily-log.md
            git commit -m "Daily log $TODAY entry $i"
          done
          git push
