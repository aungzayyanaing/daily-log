name: Daily Log
on:
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "aungzayyanaing"
          git config user.email "aungzayyanaing2@gmail.com"
          for i in $(seq 1 10); do
            echo "- $(TZ='Asia/Rangoon' date '+%Y-%m-%d') Daily log entry $i" >> daily-log.md
            git add daily-log.md
            git commit -m "Daily log $(TZ='Asia/Rangoon' date '+%Y-%m-%d') entry $i"
          done
          git push
